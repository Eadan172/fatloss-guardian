server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 本机备份文件只读端点（docker-compose 将 ./data 挂载到 html/data）
  # 前端启动时自动从此恢复数据；写入请在 dev 模式或导出 JSON 手动更新
  location = /api/backup {
    alias /usr/share/nginx/html/data/backup.json;
    default_type application/json;
    add_header Cache-Control "no-store";
  }

  # SPA 路由回退
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 静态资源缓存
  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }
}
