server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 本机备份文件端点（docker-compose 将 ./data 挂载到 html/data）
  # GET 读取（启动自动恢复）；PUT 写入（WebDAV，数据变化自动保存），与 dev 中间件行为一致
  location = /api/backup {
    alias /usr/share/nginx/html/data/backup.json;
    default_type application/json;
    add_header Cache-Control "no-store";
    dav_methods PUT;
  }

  # SPA 路由回退
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 静态资源缓存
  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }
}
